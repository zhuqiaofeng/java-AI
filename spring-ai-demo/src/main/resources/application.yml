server:
  port: 8080
  # SSE 长连接不要被容器提前断掉
  tomcat:
    connection-timeout: 120000

spring:
  application:
    name: spring-ai-demo
  ai:
    openai:
      # 通义千问的 OpenAI 兼容端点。换 DeepSeek 只需改这两行 + api-key 变量名。
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      # 从环境变量读密钥，绝不写死在文件里（第 3 周的 keys.env 同理）
      api-key: ${DASHSCOPE_API_KEY}
      chat:
        options:
          model: qwen-plus
          temperature: 0.7
          # 第 3 周实测：普通问答 130 token 够，长解释 570 token；这里给 1024 留余量
          max-tokens: 1024

logging:
  level:
    com.ai: INFO
    org.springframework.ai: INFO
