<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spring AI 流式问答演示</title>
    <style>
        :root {
            --bg: #0f172a;
            --panel: #1e293b;
            --line: #334155;
            --text: #e2e8f0;
            --muted: #94a3b8;
            --accent: #14b8a6;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; padding: 40px 20px;
            background: radial-gradient(1200px 600px at 50% -10%, #1e3a5f 0%, var(--bg) 55%);
            color: var(--text);
            font-family: "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
        }
        .wrap { max-width: 820px; margin: 0 auto; }
        h1 { font-size: 22px; font-weight: 600; margin: 0 0 6px; letter-spacing: .5px; }
        .sub { color: var(--muted); font-size: 13px; margin-bottom: 24px; }
        .card {
            background: var(--panel); border: 1px solid var(--line);
            border-radius: 14px; padding: 20px;
            box-shadow: 0 12px 32px rgba(0,0,0,.35);
        }
        textarea {
            width: 100%; min-height: 76px; resize: vertical;
            background: #0b1220; color: var(--text);
            border: 1px solid var(--line); border-radius: 10px;
            padding: 12px; font-size: 14px; line-height: 1.6;
            font-family: inherit; outline: none;
        }
        textarea:focus { border-color: var(--accent); }
        .row { display: flex; gap: 10px; align-items: center; margin-top: 12px; flex-wrap: wrap; }
        button {
            background: var(--accent); color: #04211d; border: 0;
            padding: 10px 20px; border-radius: 10px; font-size: 14px; font-weight: 600;
            cursor: pointer; transition: transform .1s ease, filter .2s ease;
        }
        button:hover { filter: brightness(1.1); }
        button:active { transform: translateY(1px); }
        button:disabled { opacity: .55; cursor: not-allowed; }
        .ghost {
            background: transparent; color: var(--muted);
            border: 1px solid var(--line); font-weight: 500;
        }
        .stat { color: var(--muted); font-size: 12px; margin-left: auto; font-variant-numeric: tabular-nums; }
        #answer {
            margin-top: 18px; padding: 16px; min-height: 120px;
            background: #0b1220; border: 1px solid var(--line); border-radius: 10px;
            font-size: 14px; line-height: 1.8; white-space: pre-wrap;
            color: var(--text);
        }
        .cursor {
            display: inline-block; width: 7px; height: 15px; margin-left: 2px;
            background: var(--accent); vertical-align: -2px; animation: blink 1s steps(1) infinite;
        }
        @keyframes blink { 50% { opacity: 0; } }
        .hint { color: var(--muted); font-size: 12px; margin-top: 10px; line-height: 1.7; }
        .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; background: rgba(20,184,166,.15); color: var(--accent); font-size: 12px; margin-right: 6px; }
    </style>
</head>
<body>
<div class="wrap">
    <h1>Spring AI 流式问答</h1>
    <div class="sub">后端 <span class="badge">GET /api/ai/chat/stream</span> 返回 text/event-stream，前端用 EventSource 逐字接收</div>

    <div class="card">
        <textarea id="question" placeholder="问点什么，例如：用三句话解释什么是 RAG">用三句话解释什么是 SSE 流式输出</textarea>
        <div class="row">
            <button id="send">开始提问</button>
            <button id="stop" class="ghost">停止</button>
            <span class="stat" id="stat">等待提问</span>
        </div>
        <div id="answer"></div>
        <div class="hint">
            提示：<code>EventSource</code> 只支持 GET（问题放在 URL 上），所以这里走 GET 接口；
            真实前端若要用 POST + JSON，需要用 <code>fetch</code> 读 <code>ReadableStream</code> 手动解析 <code>data:</code> 帧。
        </div>
    </div>
</div>

<script>
    const $ = id => document.getElementById(id);
    let es = null, startTs = 0, firstTs = 0, chars = 0;

    const setStat = t => $('stat').textContent = t;

    $('send').onclick = () => {
        const q = $('question').value.trim();
        if (!q) { setStat('请先输入问题'); return; }
        if (es) { es.close(); es = null; }

        $('answer').textContent = '';
        chars = 0; firstTs = 0;
        startTs = performance.now();
        setStat('连接中…');
        $('send').disabled = true;

        es = new EventSource('/api/ai/chat/stream?question=' + encodeURIComponent(q));

        es.onmessage = e => {
            if (!firstTs) firstTs = performance.now();
            $('answer').textContent += e.data;
            chars += e.data.length;
            const first = (firstTs - startTs).toFixed(0);
            setStat(`首字 ${first} ms · 已收 ${chars} 字`);
        };

        es.onerror = () => {
            // 服务端写完关闭连接时也会触发 error，这里主动关掉避免自动重连
            if (!es) return;
            es.close(); es = null;
            const total = performance.now() - startTs;
            setStat(`完成 · 共 ${chars} 字 · 总耗时 ${(total / 1000).toFixed(1)} s`);
            $('send').disabled = false;
        };
    };

    $('stop').onclick = () => {
        if (es) { es.close(); es = null; setStat('已手动停止'); $('send').disabled = false; }
    };
</script>
</body>
</html>
